# Shared Joyce env for web + celery worker/beat (not a service).
x-joyce-environment: &joyce-environment
  # Postgres on the Docker host's localhost
  DB_HOST: host.docker.internal
  DB_PORT: "5432"
  DB_NAME: joyce
  DB_USER: ekeeya
  DB_PASSWORD: postgres

  # Talk to other services on the compose network
  JASMIN_HOST: jasmin
  JASMIN_PORT: "8990"
  JASMIN_ROUTER_PB_HOST: jasmin
  JASMIN_JCLI_USERNAME: "jcliadmin"
  JASMIN_JCLI_PASSWORD: "jclipwd"
  JASMIN_ROUTER_PB_USERNAME: "radmin"
  JASMIN_ROUTER_PB_PASSWORD: "rpwd"
  JASMIN_SMPP_PB_USERNAME: "cmadmin"
  JASMIN_SMPP_PB_PASSWORD: "cmpwd"
  JASMIN_ROUTER_PB_PORT: "8988"
  JASMIN_SMPP_PB_HOST: jasmin
  JASMIN_SMPP_PB_PORT: "8989"

  # Reachable from the jasmin container (compose DNS → nginx)
  JOYCE_PUBLIC_BASE_URL: "http://nginx"
  JASMIN_HTTP_API_URL: "http://jasmin:1401"
  JASMIN_REST_API_URL: "http://jasmin_rest:8080"

  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  # Optional: Fernet key for encrypting custom workspace Jasmin PB passwords.
  # If unset, Joyce writes one to .joyce_credentials_key on first start.
  # JOYCE_CREDENTIALS_KEY: "generate-with-Fernet.generate_key()"

  # Optional
  DEBUG: "False"

services:

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep PONG
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  rabbit-mq:
    image: rabbitmq:4.2.3-management-alpine
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 525M
    security_opt:
      - no-new-privileges:true

  jasmin:
    image: jookies/jasmin:0.11.0
    restart: unless-stopped
    container_name: jasmin
    ports:
      - 2775:2775
      - 8990:8990
      - 1401:1401
      - 8988:8988
      - 8989:8989
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbit-mq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Jasmin REST API batch worker. Built from Dockerfile.rest so it uses the SAME
  # env-driven config.py as jasmin_rest — the stock image hardcodes 127.0.0.1 for
  # the broker/redis/http-api and would ignore the env vars below.
  jasmin_celery:
    build:
      context: .
      dockerfile: Dockerfile.rest
    restart: unless-stopped
    container_name: jasmin_celery
    depends_on:
      rabbit-mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: [ "/usr/local/bin/celery", "-A", "jasmin.protocols.rest.tasks", "worker", "-l", "INFO", "-c", "4" ]
    environment:
      JASMIN_OLD_API_URI: http://jasmin:1401
      CELERY_BROKER_URL: amqp://guest:guest@rabbit-mq:5672//
      CELERY_RESULT_BACKEND: redis://:@redis:6379/1
      HTTP_THROUGHPUT_PER_WORKER: "8"
      SMART_QOS: "true"

  jasmin_rest:
    build:
      context: .
      dockerfile: Dockerfile.rest
    restart: unless-stopped
    container_name: jasmin_rest
    ports:
      - 8080:8080
    depends_on:
      - jasmin
      - jasmin_celery
      - rabbit-mq
      - redis
    entrypoint: [ "/usr/local/bin/python", "/usr/local/bin/twistd", "-n", "--pidfile=/tmp/twistd-web-restapi.pid", "web", "--wsgi=jasmin.protocols.rest.api" ]
    environment:
      JASMIN_OLD_API_URI: http://jasmin:1401
      CELERY_BROKER_URL: amqp://guest:guest@rabbit-mq:5672//
      CELERY_RESULT_BACKEND: redis://:@redis:6379/1
      HTTP_THROUGHPUT_PER_WORKER: "8"
      SMART_QOS: "true"

# Jasmin comes with a test smpp smsc on port 2775 but if you doubt it use this one
  smppsim:
    build:
      context: ./smppsim
      dockerfile: Dockerfile
    container_name: smppsim
    ports:
      - 2776:2776
      - 88:88
    volumes:
      # Live-edit inject_mo.htm without rebuilding the image
      - ./smppsim/www:/www:ro
    restart: unless-stopped
    entrypoint: [ "/entrypoint.sh" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Joyce (Django + Celery). Leave these on for a full stack.
  # For IDE debugging, comment out joyce, joyce_celery, and joyce_celery_beat,
  # then run manage.py / Celery on the host against Jasmin, Redis, and Rabbit below.
  joyce:
    container_name: joyce
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - joyce_static:/app/sitestatic
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
      jasmin:
        condition: service_started
      jasmin_rest:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment

  joyce_celery:
    container_name: joyce_celery
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      joyce:
        condition: service_started
      jasmin:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment
    # Same image/entrypoint as joyce; command runs Celery instead of runserver
    command: ["celery", "-A", "quark", "worker", "-l", "INFO"]

  joyce_celery_beat:
    container_name: joyce_celery_beat
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      joyce:
        condition: service_started
      joyce_celery:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment
    command: ["celery", "-A", "quark", "beat", "-l", "INFO"]

volumes:
  joyce_static:
