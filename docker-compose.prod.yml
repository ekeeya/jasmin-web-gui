# Ubuntu / server stack.
# Images talk to each other on the compose network. Only HTTP UIs + SMPP are published.
# restart: "no" so Supervisor's `compose up --abort-on-container-exit` can stop
# the whole stack when any container dies. Supervisor then restarts the program.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   sudo supervisorctl restart joyce

x-joyce-environment: &joyce-environment
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-joyce}
  DB_USER: ${DB_USER:-joyce}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}

  # Docker DNS — never the public host ports
  JASMIN_HOST: jasmin
  JASMIN_PORT: "8990"
  JASMIN_JCLI_USERNAME: ${JASMIN_JCLI_USERNAME:-jcliadmin}
  JASMIN_JCLI_PASSWORD: ${JASMIN_JCLI_PASSWORD:-jclipwd}
  JASMIN_ROUTER_PB_HOST: jasmin
  JASMIN_ROUTER_PB_PORT: "8988"
  JASMIN_ROUTER_PB_USERNAME: ${JASMIN_ROUTER_PB_USERNAME:-radmin}
  JASMIN_ROUTER_PB_PASSWORD: ${JASMIN_ROUTER_PB_PASSWORD:-rpwd}
  JASMIN_SMPP_PB_HOST: jasmin
  JASMIN_SMPP_PB_PORT: "8989"
  JASMIN_SMPP_PB_USERNAME: ${JASMIN_SMPP_PB_USERNAME:-cmadmin}
  JASMIN_SMPP_PB_PASSWORD: ${JASMIN_SMPP_PB_PASSWORD:-cmpwd}
  JASMIN_HTTP_API_URL: http://jasmin:1401
  # Container port stays 8080. Host publish is 9010 (see jasmin_rest.ports).
  JASMIN_REST_API_URL: http://jasmin_rest:8080

  # Must match GUNICORN_BIND and the container side of joyce.ports (8000).
  JOYCE_PUBLIC_BASE_URL: http://joyce:8000
  JOYCE_CREDENTIALS_KEY: ${JOYCE_CREDENTIALS_KEY:-}

  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:9003,http://localhost:9003}

  # Inside the container only. Host publish is 9003:8000. Do not set this in .env.prod
  # to :9000 or curl 9003 will reset (nothing listening on container 8000).
  GUNICORN_BIND: "0.0.0.0:8000"
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}

services:
  redis:
    image: redis:alpine
    restart: "no"
    healthcheck:
      test: redis-cli ping | grep PONG
    security_opt:
      - no-new-privileges:true

  rabbit-mq:
    image: rabbitmq:4.2.3-management-alpine
    restart: "no"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    security_opt:
      - no-new-privileges:true

  jasmin:
    image: jookies/jasmin:0.11.0
    restart: "no"
    container_name: jasmin
    # 2775: Jasmin SMPP server (test SMSC) on all interfaces.
    # 1401: classic HTTP API, loopback only.
    # 8988/8989: Router PB + SMPP CCM PB. Joyce uses jasmin:8988/8989 on the
    # compose network; loopback publish is for host-side tools.
    # 8990: jcli (telnet), loopback only, for your own tests.
    ports:
      - "2775:2775"
      - "127.0.0.1:1401:1401"
      - "127.0.0.1:8988:8988"
      - "127.0.0.1:8989:8989"
      - "127.0.0.1:8990:8990"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbit-mq
    security_opt:
      - no-new-privileges:true

  jasmin_celery:
    build:
      context: .
      dockerfile: Dockerfile.rest
    image: joyce-jasmin-rest:0.11.0
    restart: "no"
    container_name: jasmin_celery
    depends_on:
      rabbit-mq:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: [ "/usr/local/bin/celery", "-A", "jasmin.protocols.rest.tasks", "worker", "-l", "INFO", "-c", "4" ]
    environment:
      JASMIN_OLD_API_URI: http://jasmin:1401
      CELERY_BROKER_URL: amqp://guest:guest@rabbit-mq:5672//
      CELERY_RESULT_BACKEND: redis://:@redis:6379/1
      HTTP_THROUGHPUT_PER_WORKER: "8"
      SMART_QOS: "true"

  jasmin_rest:
    build:
      context: .
      dockerfile: Dockerfile.rest
    image: joyce-jasmin-rest:0.11.0
    restart: "no"
    container_name: jasmin_rest
    ports:
      # host:container  (browser/nginx use 9010; app inside listens on 8080)
      - "127.0.0.1:9010:8080"
    depends_on:
      - jasmin
      - jasmin_celery
    entrypoint: [ "/usr/local/bin/python", "/usr/local/bin/twistd", "-n", "--pidfile=/tmp/twistd-web-restapi.pid", "web", "--wsgi=jasmin.protocols.rest.api" ]
    environment:
      JASMIN_OLD_API_URI: http://jasmin:1401
      CELERY_BROKER_URL: amqp://guest:guest@rabbit-mq:5672//
      CELERY_RESULT_BACKEND: redis://:@redis:6379/1
      HTTP_THROUGHPUT_PER_WORKER: "8"
      SMART_QOS: "true"

  smppsim:
    build:
      context: ./smppsim
      dockerfile: Dockerfile
    image: joyce-smppsim:latest
    container_name: smppsim
    ports:
      - "127.0.0.1:88:88"
      # SMPPSim SMPP. Open 2776 on the host firewall if ESMEs should bind here.
      # Jasmin in Docker already uses smppsim:2776 without this publish.
      - "2776:2776"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  joyce:
    image: joyce-app:latest
    container_name: joyce
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
      jasmin:
        condition: service_started
      jasmin_rest:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment
    ports:
      # host:container  (nginx -> 9003; Gunicorn binds 8000 in the container)
      - "127.0.0.1:9003:8000"

  joyce_celery:
    image: joyce-app:latest
    container_name: joyce_celery
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      joyce:
        condition: service_started
      jasmin:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment
    command: ["celery", "-A", "quark", "worker", "-l", "INFO"]

  joyce_celery_beat:
    image: joyce-app:latest
    container_name: joyce_celery_beat
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      joyce:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *joyce-environment
    command: ["celery", "-A", "quark", "beat", "-l", "INFO"]
