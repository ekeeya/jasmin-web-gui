# Host nginx (not a container). Copy to the Ubuntu box:
#   sudo cp deploy/nginx-oddjobs.tech.conf /etc/nginx/sites-available/oddjobs.tech
#   sudo ln -s /etc/nginx/sites-available/oddjobs.tech /etc/nginx/sites-enabled/
#
# First-time certs (HTTP-01). After this, Certbot will inject ssl_* into these
# server blocks or add a sibling 443 block — keep the proxy_pass lines.
#
#   sudo certbot --nginx \
#     -d joyce.oddjobs.tech \
#     -d jasmin.oddjobs.tech \
#     -d sms.oddjobs.tech \
#     -d sim.oddjobs.tech
#
# smpp.oddjobs.tech is TCP 2775 only — no server{} for it.
#
# Docker publishes HTTP only on loopback:
#   joyce       127.0.0.1:9000
#   jasmin REST 127.0.0.1:8080
#   jasmin HTTP 127.0.0.1:1401
#   smppsim     127.0.0.1:88
#   jasmin SMPP 0.0.0.0:2775

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── joyce.oddjobs.tech → Gunicorn :9000 ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name joyce.oddjobs.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joyce.oddjobs.tech;

    ssl_certificate     /etc/letsencrypt/live/joyce.oddjobs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyce.oddjobs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

